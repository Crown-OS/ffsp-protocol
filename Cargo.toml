[package]
name = "ffsp-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/crown-os/ffsp-protocol"

[dependencies]
aes-gcm = "0.10"
bitflags = "2.10"
blake3 = "1"
chacha20poly1305 = "0.10"
cpufeatures = "0.3"
crossbeam-queue = "0.3.12"
# risky-raw-split exposes the Noise split so every lane can be keyed separately. The risk the
# feature name warns about is unmanaged nonces, which crypto::NonceSequence handles per lane and
# refuses to wrap. Noise transport mode would put all lanes on one counter.
snow = { version = "0.10", features = ["risky-raw-split"] }
thiserror = { version = "2.0.18", default-features = false }
tokio = { version = "1.52.3", default-features = false, features = ["rt", "io-util", "macros", "sync", "time"] }
tracing = "0.1.44"
zeroize = { version = "1", features = ["zeroize_derive"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
redundant_clone = "deny"
large_enum_variant = "warn"
needless_pass_by_value = "warn"
trivially_copy_pass_by_ref = "warn"
cast_possible_truncation = "warn"
cast_lossless = "warn"
missing_const_for_fn = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[profile.bench]
inherits = "release"
debug = true

[dev-dependencies]
proptest = "1"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "io-util", "time"] }
